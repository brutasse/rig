# CI: full test suite on every branch push; on tags, the release job runs
# once the test job is green.
#
# Trigger:
#   - push to any branch → test
#   - push a tag vX.Y.Z → test, then release
#
# What test does:
#   1. on a renovate/* branch whose head is Renovate's own commit:
#      'make lock-refresh' re-bakes resolver/deps.lock from the manifests and
#      pushes it back to the branch — Renovate can move a manifest but cannot
#      run 'rig lock', and the lock is a build input (step 4)
#   2. gofmt -w rig/ — fixes formatting in place; if anything changed,
#      pushes a bot commit back to the branch (never fails)
#   3. go vet
#   4. make test — make dev builds both jars --frozen, so a dependency bump
#      that skipped 'rig lock' fails before anything else runs; then rig
#      check on this workspace (names the drifted coordinate), the kernel
#      suite (rig test, via the runner), and the Go suite (E2E vs the fresh
#      jars)
#
# Toolchain everywhere: setup-go + brutasse/setup-rig (installs the rig
# binary, the Temurin 8 pinned in resolver/deps.lock, and caches the
# artifact store) — no host JDK, no Clojure CLI.
#
# What test-jvm8 does:
#   launches the built kernel jar directly on that pinned Temurin 8 (on
#   PATH via setup-rig's java-on-path) — the floor gate: the release
#   artifact loads and answers a request on Java 8 (Clojure 1.12's
#   floor), outside rig's own jvm machinery
#
# Every build also scans both jars after assembly and fails on any class
# above the Java 8 bytecode floor (class file v52). Both release jars are
# built by rig on the pinned Temurin 8 (managed by rig), and the kernel
# suite runs on that same floor JVM — the artifact is compiled at the
# floor and exercised there.
#
# What release does:
#   1. stamps the tag version into the worktree ('make release' →
#      'prepare': resolver/VERSION + the lock's module snapshot), builds
#      the release jars at the tag version (self-hosted: the rig built
#      from the tag's sources embeds the previous cycle's kernel jar and
#      builds both new jars with it — see the Makefile 'kernel' target)
#   2. cross-compiles rig for linux/darwin amd64/arm64 with the fresh
#      jars embedded (go:embed) and version stamps (ldflags)
#   3. builds and pushes the multi-arch Docker image (the rig binary
#      alone: it embeds its own jars) to ghcr.io/brutasse/rig
#   4. publishes a GitHub release with all binaries + kernel jar +
#      runner jar + SHA256SUMS (the jars stay published as assets for
#      pre-embedding rig binaries, which fetch them by their compiled pin)
#   5. re-pins the install one-liner's git sha and bumps the version
#      examples in README.md and docs/getting-started.md on main
#   6. pushes the version stamp (resolver/VERSION + lock) to main
#
# The kernel, runner, and vendored nREPL jars ship inside the rig binary
# (go:embed): nothing is fetched at runtime and there are no hash pins to
# maintain. The runner jar is the install-time artifact hot commands
# append to the project's locked classpath.

name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    pull_request:

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: rig/go.sum
      - uses: brutasse/setup-rig@v1
        with:
          token: ${{ github.token }}
          lockfile: resolver/deps.lock
      - name: Refresh lock (Renovate branches)
        # A Renovate Clojure bump can only move a manifest, and the lock is a
        # build input — so its own PR fails the frozen kernel build until the
        # lock is re-baked. Do that here, and push the result back so the PR
        # carries manifest and lock together. Both halves of the guard are
        # load-bearing: the branch prefix is what keeps an automated commit off
        # main and off every human branch, and the actor is what keeps a human's
        # push onto a renovate/* branch from being re-locked by the bot — a
        # manifest edit you make yourself must come with your own 'rig lock'.
        if: github.actor == 'renovate[bot]' && (startsWith(github.head_ref, 'renovate/') || startsWith(github.ref_name, 'renovate/'))
        run: |
          make lock-refresh
          # locked_at moves on every re-lock: compare the resolution, not the
          # file, so a run that changed nothing has nothing to push.
          if diff -q <(jq 'del(.locked_at)' resolver/deps.lock) \
                      <(git show HEAD:resolver/deps.lock | jq 'del(.locked_at)') >/dev/null; then
            echo "resolution unchanged"
            git checkout -- resolver/deps.lock
            exit 0
          fi
          git config user.name "rig-ci[bot]"
          git config user.email "rig-ci@users.noreply.github.com"
          git add resolver/deps.lock
          git commit -m "build: refresh resolver/deps.lock"
          # The ref is guarded here too, so the push cannot reach main or a
          # human branch even if the step's 'if' is edited later.
          case "$GITHUB_REF" in
            refs/heads/renovate/*) git push origin HEAD:"${GITHUB_REF#refs/heads/}" ;;
          esac

      - name: gofmt (auto-fix)
        run: |
          gofmt -w rig/
          if git diff --quiet; then
            echo "already gofmt-clean"
            exit 0
          fi
          git config user.name "rig-ci[bot]"
          git config user.email "rig-ci@users.noreply.github.com"
          git add rig/
          git commit -m "style: gofmt"
          case "$GITHUB_REF" in
            refs/heads/*) git push origin HEAD:"${GITHUB_REF#refs/heads/}" ;;
          esac

      - name: go vet
        run: cd rig && go vet ./...

      - name: Test
        run: make test

  test-jvm8:
    # The kernel floor gate: run the built uber through a real check
    # request on the exact Temurin 8 the workspace pins (setup-rig
    # installs it and puts it on PATH) — outside rig's own jvm
    # machinery, so any class that only loads on a newer JVM fails here.
    # The suite itself runs on that same floor JVM in the test job, via
    # rig test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: rig/go.sum
      - uses: brutasse/setup-rig@v1
        with:
          token: ${{ github.token }}
          lockfile: resolver/deps.lock
          java-on-path: "true"
      # Its own checkout needs a consistent lock too; the test job is the one
      # that commits the result back to the branch.
      - name: Refresh lock (Renovate branches)
        if: github.actor == 'renovate[bot]' && (startsWith(github.head_ref, 'renovate/') || startsWith(github.ref_name, 'renovate/'))
        run: make lock-refresh

      - name: Build kernel
        run: make kernel
      - name: Kernel floor — the jar loads and runs on Java 8
        run: |
          ws=$(mktemp -d)
          printf '{:rig/lib x/y}\n' > "$ws/deps.edn"
          out=$(printf '{"op":"check","workspace":"%s"}' "$ws" \
            | java -jar "resolver/target/rig-resolver-$(cat resolver/VERSION).jar" --request -)
          echo "$out"
          echo "$out" | grep -q '"ok"'

  native-e2e:
    # Builds the testdata/native fixture into a GraalVM native binary and
    # runs it (make test-native). GraalVM is pulled by rig itself:
    # `rig graalvm install` downloads the newest community build for the
    # major the fixture's lock pins, from the
    # graalvm/graalvm-ce-builds GitHub release, sha256-verified.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: rig/go.sum
      - uses: brutasse/setup-rig@v1
        with:
          token: ${{ github.token }}
          lockfile: resolver/deps.lock
      # (no enable-graalvm: the root lock pins no GraalVM — the fixture's
      # own lock does, and the install step below fetches that major)

      # Its own checkout needs a consistent lock too (see the test job).
      - name: Refresh lock (Renovate branches)
        if: github.actor == 'renovate[bot]' && (startsWith(github.head_ref, 'renovate/') || startsWith(github.ref_name, 'renovate/'))
        run: make lock-refresh

      - name: Build
        run: make dev

      - name: Install GraalVM with rig
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          REQ=$(python3 -c "import json; print(json.load(open('rig/internal/cli/testdata/native/deps.lock'))['graalvm']['requested'])")
          rig/dist/rig graalvm install "$REQ"
          echo "GRAALVM=$(rig/dist/rig graalvm list | awk '/graalvm / {print $NF; exit}')" >> "$GITHUB_ENV"

      - name: Native E2E
        run: make test-native GRAALVM="$GRAALVM"

  release:
    permissions:
      contents: write
      packages: write
      actions: write
    runs-on: ubuntu-latest
    needs:
      - test
      - test-jvm8
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: rig/go.sum
      - uses: brutasse/setup-rig@v1
        with:
          token: ${{ github.token }}
          lockfile: resolver/deps.lock

      - name: Package release
        run: |
          v="${GITHUB_REF_NAME#v}"
          case "$v" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "bad version: $v (want X.Y.Z)" >&2; exit 1 ;;
          esac
          make release V="${GITHUB_REF_NAME}"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
          platforms: linux/amd64,linux/arm64

      - name: Docker login
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/brutasse/rig:${{ github.ref_name }}
            ghcr.io/brutasse/rig:latest

      - name: Image smoke test
        run: docker run --rm ghcr.io/brutasse/rig:${{ github.ref_name }} rig jvm list

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ github.ref_name }}"
          jarsha=$(sha256sum "resolver/target/rig-resolver-$v.jar" | cut -d' ' -f1)
          runnersha=$(sha256sum "resolver/runner/target/rig-runner-$v.jar" | cut -d' ' -f1)
          (cd rig/dist/release && sha256sum -c SHA256SUMS)
          gh release create "$v" \
            --title "$v" \
            --notes "rig $v — binaries (linux/darwin, amd64/arm64) + resolver kernel jar (sha256 $jarsha) + runner jar (sha256 $runnersha). Install: see README (curl one-liner, pinned at the release git sha). Self-update: rig self-update." \
            rig/dist/release/*

      - name: Save release stamps
        run: |
          # 'make release' stamped resolver/VERSION and the lock in the
          # worktree; keep those files and clean up so the switch to main
          # below always succeeds.
          cp resolver/VERSION "$RUNNER_TEMP/VERSION-stamped"
          cp resolver/deps.lock "$RUNNER_TEMP/deps-stamped.lock"
          git checkout -- resolver/VERSION resolver/deps.lock

      - name: Pin install one-liner and version examples in README and docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          new=${GITHUB_REF_NAME}
          git fetch origin main
          git checkout --detach origin/main
          sed -i -E \
            -e "s#brutasse/rig/([0-9a-f]{40})/scripts#brutasse/rig/$sha/scripts#" \
            -e "s#sh -s -- v[0-9][0-9A-Za-z.+~-]*#sh -s -- $new#" \
            -e "s#--version v[0-9][0-9A-Za-z.+~-]*#--version $new#" \
            -e "s#rig-resolver v[0-9][0-9A-Za-z.+~-]*#rig-resolver $new#g" \
            -e "s#version: v[0-9][0-9A-Za-z.+~-]*#version: $new#g" \
            README.md docs/getting-started.md docs/workflows/ci.md
          # The version seds must have landed: fail loudly if the doc
          # wording drifted and the examples still show an old release.
          grep -q "sh -s -- $new" README.md
          grep -q "sh -s -- $new" docs/getting-started.md
          grep -q -- "--version $new" README.md
          grep -q -- "--version $new" docs/getting-started.md
          grep -q "rig-resolver $new" docs/getting-started.md
          grep -q "version: $new" docs/workflows/ci.md
          if git diff --quiet; then
            echo "install one-liner already pinned at $sha; docs already at $new"
          else
            git config user.name "rig-release[bot]"
            git config user.email "rig-release@users.noreply.github.com"
            git add README.md docs/getting-started.md docs/workflows/ci.md
            git commit -m "docs: pin install one-liner to $new ($sha); bump version examples to $new"
            git push origin HEAD:main
            # GITHUB_TOKEN pushes don't fire push events: build the docs.
            gh workflow run docs.yml --ref main
          fi

      - name: Stamp version in main
        run: |
          # The tag is the version: 'make release' stamped resolver/VERSION
          # and the lock in the worktree (Makefile 'prepare'). Land the
          # stamp on main so the next release cuts from a stamped tree.
          git fetch origin main
          git checkout --detach origin/main
          cp "$RUNNER_TEMP/VERSION-stamped" resolver/VERSION
          cp "$RUNNER_TEMP/deps-stamped.lock" resolver/deps.lock
          git add resolver/VERSION resolver/deps.lock
          if git diff --cached --quiet; then
            echo "main already stamped for ${{ github.ref_name }}; nothing to push"
            exit 0
          fi
          git config user.name "rig-release[bot]"
          git config user.email "rig-release@users.noreply.github.com"
          git commit -m "build: stamp ${{ github.ref_name }}"
          git push origin HEAD:main
