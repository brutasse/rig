# CI: full test suite on every branch push; on tags, the release job runs
# once the test job is green.
#
# Trigger:
#   - push to any branch → test
#   - push a tag vX.Y.Z (e.g. git push origin v0.2.0) → test, then release
#
# What test does:
#   1. gofmt -w rig/ — fixes formatting in place; if anything changed,
#      pushes a bot commit back to the branch (never fails)
#   2. go vet
#   3. make test — kernel kaocha + Go suite, E2E vs the freshly built jar
#
# What test-jvm8 does:
#   builds the kernel on a Temurin 8 and runs its suite there — the floor
#   gate: the kernel jar must load and run on Java 8 (Clojure 1.12's floor)
#
# What release does:
#   1. builds the kernel jar at the tag version, stamps it into the kernel
#      pin (GitHub release URL + git sha + jar sha256)
#   2. cross-compiles rig for linux/darwin amd64/arm64 with version stamps
#   3. builds and pushes the multi-arch Docker image (rig binary +
#      hash-pinned kernel jar) to ghcr.io/brutasse/rig
#   4. publishes a GitHub release with all binaries + kernel jar + SHA256SUMS
#   5. re-pins the install one-liner's git sha in README.md on main
#   6. pushes the stamped kernel pin to main
#
# The kernel jar is served exclusively from the GitHub release (no Maven
# repo): rig binaries fetch it by their compiled pin, hash-verified.

name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    pull_request:

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          cli: "1.12.5.1664"
      - name: gofmt (auto-fix)
        run: |
          gofmt -w rig/
          if git diff --quiet; then
            echo "already gofmt-clean"
            exit 0
          fi
          git config user.name "rig-ci[bot]"
          git config user.email "rig-ci@users.noreply.github.com"
          git add rig/
          git commit -m "style: gofmt"
          case "$GITHUB_REF" in
            refs/heads/*) git push origin HEAD:"${GITHUB_REF#refs/heads/}" ;;
          esac

      - name: go vet
        run: cd rig && go vet ./...

      - name: Test
        run: make test

  test-jvm8:
    # The kernel floor gate: build the jar on a Temurin 8 and run its suite
    # there, so any class that only loads on a newer JVM fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "8"
      - uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          cli: "1.12.5.1664"
      - name: Build kernel on Java 8
        run: make kernel
      - name: Kernel floor — the jar loads and runs on Java 8
        run: |
          ws=$(mktemp -d)
          printf '{:rig/lib x/y}\n' > "$ws/deps.edn"
          out=$(printf '{"op":"check","workspace":"%s"}' "$ws" \
            | java -jar resolver/target/rig-resolver-v0.1.0.jar --request -)
          echo "$out"
          echo "$out" | grep -q '"ok"'
      - name: Kernel test suite on Java 8
        run: cd resolver && CLOJURE_CLI_ALLOW_HTTP_REPO=1 clojure -X:test

  release:
    runs-on: ubuntu-latest
    needs:
      - test
      - test-jvm8
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          cli: "1.12.5.1664"

      - name: Package release
        run: |
          v="${GITHUB_REF_NAME#v}"
          case "$v" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "bad version: $v (want X.Y.Z)" >&2; exit 1 ;;
          esac
          make release V="${GITHUB_REF_NAME}"

      - name: Record image build args
        run: |
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "jar_sha=$(sha256sum rig/dist/release/rig-resolver-${{ github.ref_name }}.jar | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker-container
          platforms: linux/amd64,linux/arm64

      - name: Docker login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/brutasse/rig:${{ github.ref_name }}
            ghcr.io/brutasse/rig:latest
          build-args: |
            V=${{ github.ref_name }}
            KERNEL_GITSHA=${{ env.release_sha }}
            JARSHA=${{ env.jar_sha }}

      - name: Image smoke test
        run: docker run --rm ghcr.io/brutasse/rig:${{ github.ref_name }} rig jvm list

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ github.ref_name }}"
          jarsha=$(sha256sum "resolver/target/rig-resolver-$v.jar" | cut -d' ' -f1)
          (cd rig/dist/release && sha256sum -c SHA256SUMS)
          gh release create "$v" \
            --title "$v" \
            --notes "rig $v — binaries (linux/darwin, amd64/arm64) + resolver kernel jar (sha256 $jarsha). Install: see README (curl one-liner, pinned at the release git sha). Self-update: rig self-update." \
            rig/dist/release/*

      - name: Pin install one-liner in README and docs
        run: |
          sha=$(git rev-parse HEAD)
          git fetch origin main
          git checkout --detach origin/main
          sed -i -E "s#brutasse/rig/([0-9a-f]{40}|PENDING-FIRST-RELEASE)/scripts#brutasse/rig/$sha/scripts#" README.md docs/getting-started.md
          if git diff --quiet; then
            echo "install one-liner already pinned at $sha"
          else
            git config user.name "rig-release[bot]"
            git config user.email "rig-release@users.noreply.github.com"
            git add README.md docs/getting-started.md
            git commit -m "docs: pin install one-liner to ${{ github.ref_name }} ($sha)"
            git push origin HEAD:main
          fi

      - name: Pin kernel in main
        run: |
          # Explicit a/ b/ prefixes: 'git apply' mishandles no-prefix
          # headers (diff.noprefix) by stripping a path component.
          git diff --src-prefix=a/ --dst-prefix=b/ -- rig/internal/kernel/kernel.go > pin.patch
          if [ ! -s pin.patch ]; then
            echo "kernel pin unchanged; nothing to push"
            exit 0
          fi
          git fetch origin main
          git checkout --detach origin/main
          git apply pin.patch
          git config user.name "rig-release[bot]"
          git config user.email "rig-release@users.noreply.com"
          git add rig/internal/kernel/kernel.go
          git commit -m "kernel: pin ${{ github.ref_name }}"
          git push origin HEAD:main
