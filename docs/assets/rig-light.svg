<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- derrick legs + crown -->
  <g stroke="#63B131" stroke-width="26">
    <path d="M108 436 L188 140"/>
    <path d="M404 436 L324 140"/>
    <path d="M188 140 L324 140"/>
  </g>
  <!-- lattice: ties -->
  <g stroke="#63B131" stroke-width="12" opacity="0.55">
    <path d="M128 360 H384"/>
    <path d="M149 284 H363"/>
    <path d="M170 208 H342"/>
